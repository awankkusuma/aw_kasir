name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Unduh pustaka QR (agar jalan offline)
        run: |
          mkdir -p www/lib
          curl -fsSL -o www/lib/jsQR.js https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js
          curl -fsSL -o www/lib/qrcode.js https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js
      - run: npm install
      - run: npx cap add android
      - name: Izin kamera dan Bluetooth, plugin cetak Bluetooth
        run: |
          sed -i 's#<application#<uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.BLUETOOTH" android:maxSdkVersion="30" />\n    <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" android:maxSdkVersion="30" />\n    <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />\n    <application#' android/app/src/main/AndroidManifest.xml
          cp native/*.java android/app/src/main/java/id/pawone/kasir/
      - name: Ikon aplikasi dari logo
        run: npx capacitor-assets generate --android
        continue-on-error: true
      - run: npx cap sync android
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: pawone-kasir-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
